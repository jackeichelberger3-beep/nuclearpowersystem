<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logic System v1 - Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="topbar">
    <div id="title">Logic System v1 — Prototype</div>
    <div id="controls">
      <button id="btn-save">Save</button>
      <button id="btn-load">Load</button>
      <button id="btn-templates">Templates</button>
      <button id="btn-step">Step</button>
      <button id="btn-run">Run/Pause</button>
      <input id="file-input" type="file" style="display:none" />
    </div>
  </div>

  <div id="app">
    <div id="palette">
      <h3>Palette</h3>
      <div class="tool" data-type="AND">AND</div>
      <div class="tool" data-type="OR">OR</div>
      <div class="tool" data-type="NOT">NOT</div>
      <div class="tool" data-type="NAND">NAND</div>
      <div class="tool" data-type="NOR">NOR</div>
      <div class="tool" data-type="XOR">XOR</div>
      <div class="tool" data-type="XNOR">XNOR</div>
      <div class="tool" data-type="SPLITTER">Splitter</div>
      <div class="tool" data-type="BUTTON">Button</div>
      <div class="tool" data-type="LED">LED</div>
      <div class="tool" data-type="TEXT">Text Panel</div>
      <div class="tool" data-type="KEYBOARD">Keyboard</div>
      <div class="tool" data-type="SR">SR Latch</div>
      <div class="tool" data-type="DLATCH">D Latch</div>
      <div class="tool" data-type="MEMORY">Memory</div>
      <div class="tool" data-type="EEPROM8">EEPROM 8-bit</div>
      <div class="tool" data-type="EEPROM16">EEPROM 16-bit</div>
      <div class="tool" data-type="COUNTER4">4-bit Counter</div>
      <div class="tool" data-type="SHIFTER4">4-bit Shifter</div>
      <div class="tool" data-type="SHIFTER8">8-bit Shifter</div>
      <div class="tool" data-type="GROUP">Save Group as Preset</div>
      <div id="presets-list"><h4>Presets</h4></div>
    </div>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="minimap"></div>
    </div>

    <div id="inspector">
      <h3>Inspector</h3>
      <div id="selected-info">No selection</div>
    </div>
  </div>

  <div id="templates-modal" class="modal">
    <div class="modal-content">
      <h3>Templates</h3>
      <button class="template-btn" data-template="basic-adder">Basic Adder (example)</button>
      <button class="template-btn" data-template="8bit-system">8-bit System (skeleton)</button>
      <button class="template-btn" data-template="16bit-system">16-bit System (skeleton)</button>
      <button class="template-btn" data-template="os-demo">Terminal OS Demo</button>
      <button class="template-btn" data-template="sr-demo">SR Latch Demo</button>
      <button class="template-btn" data-template="d-latch-demo">D Latch Demo</button>
      <button class="template-btn" data-template="eeprom-demo">EEPROM 8-bit Demo</button>
      <button class="template-btn" data-template="counter-demo">Counters Demo</button>
      <button id="close-templates">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
